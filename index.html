<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#232B52">
<meta name="color-scheme" content="light">
<meta name="description" content="離線星球 OFFLINE : PLANET｜2026圖書館週 Library Week：115/11/30 – 12/10 活動日程與時間軸。">
<title>離線星球 OFFLINE : PLANET｜2026圖書館週</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFCF6;
  --ink:#3E3A39;
  --coral:#F2A497;
  --yellow:#F6D27A;
  --sky:#A8D3E6;
  --green:#B9DAA5;
  --muted:#6B6563;
  --nav-h:58px;
  --night:#232B52;
  --muted-sky:#C5CBE0;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--nav-h) + 12px);-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--night);color:var(--paper);
  font-family:"Huninn","jf-openhuninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  font-weight:400;font-size:16px;line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,b,strong{font-weight:400}
[hidden]{display:none !important}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:12px}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}
.skip{position:absolute;left:-999px;top:8px;color:var(--ink);background:var(--yellow);border:3px solid var(--ink);border-radius:999px;padding:4px 14px;z-index:200}
.skip:focus{left:12px}

/* ---------- 星空底 ---------- */
.sky{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;background:var(--night)}
.sky svg{display:block;width:100%;height:100%}
.st{transform-box:fill-box;transform-origin:center;animation:twk 3.6s ease-in-out infinite}
@keyframes twk{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.25;transform:scale(.6)}}

/* ---------- 頂端固定選單 ---------- */
.nav{position:fixed;inset:0 0 auto 0;height:var(--nav-h);background:var(--paper);border-bottom:3px solid var(--ink);z-index:100}
.nav-in{height:100%;display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;align-items:center;gap:7px;color:var(--ink);text-decoration:none;white-space:nowrap}
.brand .bt{display:grid;line-height:1.15}
.brand .bt b{font-size:17px}
.brand .bt small{font-size:9.5px;letter-spacing:.06em;color:var(--muted)}
.brand svg{width:28px;height:28px;fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.brand svg .pg{fill:var(--yellow)}
.nav nav{display:flex;gap:4px}
.nav nav a{color:var(--ink);text-decoration:none;font-size:14px;padding:3px 9px;border:3px solid transparent;border-radius:999px;transition:transform .2s cubic-bezier(.34,1.56,.64,1),background-color .2s}
.nav nav a:active{transform:scale(.92)}
.nav nav a.on{background:var(--yellow);border-color:var(--ink)}
.brand:active svg{transform:rotate(-8deg)}

main.wrap{padding-top:calc(var(--nav-h) + 16px)}

/* ---------- 首頁 ---------- */
.art-card{border:3px solid var(--ink);border-radius:32px;overflow:hidden;box-shadow:0 6px 0 var(--ink);background:#1E2447}
.hero-svg{display:block;width:100%;height:auto}
.hero-svg text{font-family:inherit}
.title-block{text-align:center;padding:28px 0 4px}
.date-pill{display:inline-block;color:var(--ink);margin:0 0 12px;padding:1px 16px;background:var(--coral);border:3px solid var(--ink);border-radius:999px;font-size:14px;letter-spacing:.04em}
h1{margin:0;line-height:1.25}
.t1{display:inline-block;font-size:clamp(46px,14vw,68px);letter-spacing:.04em;padding:0 .1em;border-bottom:6px solid var(--yellow);border-radius:4px}
.en{display:block;margin-top:10px;font-size:clamp(15px,4.8vw,21px);letter-spacing:.2em;color:var(--sky)}
.t2{display:block;margin-top:20px;font-size:clamp(26px,8vw,36px);letter-spacing:.06em}
.en2{display:block;font-size:clamp(16px,5vw,22px);letter-spacing:.16em;color:var(--yellow)}
.lead{margin:16px auto 0;max-width:30em;font-size:15px;color:var(--muted-sky)}

/* ---------- 日程 ---------- */
#schedule{margin-top:40px}
.sec-head h2{margin:0;font-size:30px;line-height:1.3}
.sec-head p{margin:2px 0 0;font-size:14px;color:var(--muted-sky)}
.strip-wrap{position:sticky;top:var(--nav-h);z-index:50;background:rgba(35,43,82,.94);margin:10px -16px 0;padding:8px 16px 0}
.day-strip{display:flex;gap:10px;overflow-x:auto;padding:10px 4px 14px;scrollbar-width:none;position:relative;-webkit-overflow-scrolling:touch}
.day-strip::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;width:60px;padding:6px 0 8px;display:grid;justify-items:center;line-height:1.25;font:inherit;color:var(--ink);background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:0 4px 0 var(--ink);cursor:pointer;transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s,background-color .2s}
.chip small{font-size:11px;color:var(--muted)}
.chip .n{font-size:25px;line-height:1.2}
.chip .w{font-size:12px}
.chip.we .w{color:#B5483A}
.chip .dot{width:9px;height:9px;margin-top:3px;border-radius:50%;border:2px solid transparent}
.chip .dot.on{background:var(--coral);border-color:var(--ink)}
.chip:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.chip.is-active{background:var(--coral);transform:translateY(-3px);box-shadow:0 7px 0 var(--ink);animation:chipPop .55s cubic-bezier(.34,1.3,.64,1)}
.chip.is-active small,.chip.is-active.we .w{color:var(--ink)}
.chip.is-active .dot.on{background:var(--paper)}
.chip.all{background:var(--yellow)}
.chip.all.is-active{background:var(--green)}

.day-head{margin:16px 0 18px}
.day-head h3{margin:0;font-size:30px;line-height:1.3}
.day-head .wd{display:inline-block;color:var(--ink);margin-left:8px;padding:0 10px;font-size:14px;vertical-align:middle;background:var(--sky);border:2.5px solid var(--ink);border-radius:999px}
.day-head p{margin:2px 0 0;font-size:14px;color:var(--muted-sky)}

.timeline{list-style:none;margin:0;padding:0;position:relative}
.timeline::before{content:"";position:absolute;left:79px;top:16px;bottom:30px;border-left:3px dashed #8E96B8;transform:translateX(-50%)}
.tl-group{display:grid;grid-template-columns:58px 20px 1fr;column-gap:10px;align-items:start;margin-bottom:20px}
.tl-time{text-align:right;padding-top:0;line-height:1.3}
.tl-time b{display:block;font-size:18px}
.tl-time span{font-size:12px;color:var(--muted-sky)}
.tl-dot{width:20px;height:20px;margin-top:5px;border:3px solid var(--ink);border-radius:50%;background:var(--c);box-shadow:0 0 0 5px var(--night);position:relative;z-index:1}
.tl-cards{display:grid;gap:14px;min-width:0}

.ev{background:var(--c);color:var(--ink);border:3px solid var(--ink);border-radius:22px;padding:12px 14px 14px;box-shadow:4px 5px 0 var(--ink)}
.ev-top{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:0 10px 0 6px;font-size:12px;background:var(--paper);border:2.5px solid var(--ink);border-radius:999px}
.badge svg{width:16px;height:16px;fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tag{padding:0 9px;font-size:12px;border:2.5px dashed var(--ink);border-radius:999px}
.tag.live{background:var(--ink);color:var(--paper);border-style:solid;display:inline-flex;align-items:center;gap:5px}
.tag.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--coral);animation:pulse 1.2s ease-in-out infinite}
.ev-title{margin:0;font-size:18px;line-height:1.5}
.ev-place,.ev-link{display:flex;gap:6px;align-items:flex-start;margin:8px 0 0;font-size:14px;line-height:1.5}
.ev-link a{color:var(--ink);text-underline-offset:3px}
.ev-desc{margin:12px 0 0;padding-top:12px;border-top:2.5px dashed var(--ink);font-size:14px;line-height:1.8}
.ev-place svg,.ev-link svg{flex:0 0 auto;width:16px;height:16px;margin-top:3px;fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

.sub-title{display:flex;align-items:center;gap:8px;margin:30px 0 4px;font-size:19px}
.sub-title svg{width:24px;height:24px;fill:var(--green);stroke:var(--paper);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.sub-note{margin:0 0 14px;font-size:13px;color:var(--muted-sky)}
.ongoing-list{display:grid;gap:14px}

.empty{text-align:center;padding:18px 16px 20px;border:3px dashed #8E96B8;border-radius:26px}
.empty svg{width:140px;height:auto}
.empty p{margin:6px 0 0;font-size:15px}

/* ---------- 抽獎 ---------- */
#prizes{margin-top:56px}
.prize-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 16px;margin-top:22px}
.prize{position:relative;color:var(--ink);background:var(--c);border:3px solid var(--ink);border-radius:26px;box-shadow:0 6px 0 var(--ink);padding:14px 10px 14px;text-align:center}
.prize .no{position:absolute;top:-13px;left:14px;padding:0 10px;font-size:12px;line-height:1.7;background:var(--paper);border:2.5px solid var(--ink);border-radius:999px}
.prize-img{aspect-ratio:1;display:grid;place-items:center;margin:4px 0 10px;background:var(--paper);border:3px solid var(--ink);border-radius:22px;overflow:hidden}
.prize-img>*{display:block;width:84%;height:84%;object-fit:contain;animation:bob 3.2s ease-in-out infinite alternate;animation-delay:calc(var(--i,0) * -.8s)}
.prize h3{margin:0;font-size:17px;line-height:1.4}

footer{margin:52px 0 32px;text-align:center;font-size:13px;color:var(--muted-sky)}
footer .bar{display:block;width:72px;height:10px;margin:0 auto 14px;border:3px solid var(--ink);border-radius:999px;background:var(--sky)}

/* ---------- 動畫 ---------- */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{from{transform:translateX(-10px)}to{transform:translateX(18px)}}
@keyframes bob{from{transform:translateY(-4px)}to{transform:translateY(5px)}}
@keyframes sway{from{transform:rotate(-1.8deg)}to{transform:rotate(1.8deg)}}
@keyframes flick{from{transform:scaleY(.75)}to{transform:scaleY(1.25)}}
@keyframes tw{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(.5) rotate(30deg)}}
@keyframes lit{0%,100%{fill:#F6D27A}50%{fill:#FFFCF6}}
@keyframes wave{from{transform:scaleX(1) skewY(0)}to{transform:scaleX(.72) skewY(6deg)}}
@keyframes flapL{from{transform:rotate(-6deg)}to{transform:rotate(16deg)}}
@keyframes flapR{from{transform:rotate(6deg)}to{transform:rotate(-16deg)}}
@keyframes dash{to{stroke-dashoffset:-18}}
@keyframes zz{from{transform:translateY(0);opacity:.4}to{transform:translateY(-6px);opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.6)}}
@keyframes chipPop{
  0%{transform:translateY(0) scale(.88)}
  45%{transform:translateY(-14px) scale(1.1)}
  70%{transform:translateY(1px) scale(.97)}
  100%{transform:translateY(-3px) scale(1)}
}
@keyframes bounceIn{
  0%{opacity:0;transform:translateY(28px) scale(.9)}
  55%{opacity:1;transform:translateY(-7px) scale(1.02)}
  78%{transform:translateY(2px) scale(.995)}
  100%{opacity:1;transform:none}
}

.planet{animation:bob 4s ease-in-out infinite alternate}
.gal{transform-origin:0 0;animation:spin 70s linear infinite}
.ringwob{transform-origin:0 0;animation:ringwob 5s ease-in-out infinite alternate}
@keyframes ringwob{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.drift{animation:drift 14s ease-in-out infinite alternate}
.drift.d2{animation-duration:11s;animation-direction:alternate-reverse}
.drift.d3{animation-duration:18s}
.rocket{animation:bob 3s ease-in-out infinite alternate}
.flame{transform-box:fill-box;transform-origin:50% 0;animation:flick .32s ease-in-out infinite alternate}
.trail{stroke-dasharray:2 7;animation:dash 1.4s linear infinite}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 2.8s ease-in-out infinite}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 4.6s ease-in-out infinite alternate}
.win{fill:#F6D27A}
.lit{animation:lit 4.5s ease-in-out infinite}
.flag{transform-box:fill-box;transform-origin:0 50%;animation:wave 1.8s ease-in-out infinite alternate}
.minute{transform-origin:180px 92px;animation:spin 36s linear infinite}
.hour{transform-origin:180px 92px;animation:spin 432s linear infinite}
.bird{animation:bob 2.4s ease-in-out infinite alternate}
.wl{transform-box:fill-box;transform-origin:100% 100%;animation:flapL .65s ease-in-out infinite alternate}
.wr{transform-box:fill-box;transform-origin:0 100%;animation:flapR .65s ease-in-out infinite alternate}
.zz{animation:zz 1.6s ease-in-out infinite alternate}

.bounce{animation:bounceIn .65s cubic-bezier(.34,1.45,.64,1) both;animation-delay:calc(var(--i,0) * 80ms)}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none !important;transition:none !important;scroll-behavior:auto !important}
}

@media (min-width:560px){
  .tl-group{grid-template-columns:70px 20px 1fr}
  .timeline::before{left:91px}
  .ev-title{font-size:20px}
}
</style>
</head>

<script>
(() => {
  'use strict';

  const WD = ['日','一','二','三','四','五','六'];
  const TYPES = {
    talk:   {label:'講座課程', color:'var(--sky)',    icon:'<path d="M4 5h16a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-8l-5 4v-4H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/>'},
    fun:    {label:'體驗表演', color:'var(--coral)',  icon:'<path d="M12 20s-8-5-8-11a4.5 4.5 0 0 1 8-2.5A4.5 4.5 0 0 1 20 9c0 6-8 11-8 11z"/>'},
    point:  {label:'集點截止', color:'var(--coral)',  icon:'<circle cx="12" cy="13" r="7"/><path d="M12 9v4l2.5 2M5 4 3 6M19 4l2 2"/>'},
    market: {label:'趣味市集', color:'var(--yellow)', icon:'<path d="M3 9l2-5h14l2 5z"/><path d="M5 9v11h14V9"/><path d="M10 20v-6h4v6"/>'},
    show:   {label:'展示展映', color:'var(--green)',  icon:'<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 16l5-5 4 4 3-3 6 6"/><circle cx="15.5" cy="9" r="1.2"/>'}
  };
  const LINK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>';
  const PIN = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6-5.6-6-10a6 6 0 1 1 12 0c0 4.4-6 10-6 10z"/><circle cx="12" cy="11" r="2.2"/></svg>';

  // 日期皆為西元（民國 115 = 2026，116 = 2027）
  const EVENTS = [
    {id:1,  title:'觀看機制中的折返', tag:'藝術家座談', s:'2026-11-30', e:'2026-11-30', time:'14:00-16:00', place:'圖書館1F 多功能展演廳', type:'talk',
     link:'', desc:'由藝術家尹信方老師、謝其昌老師、鄭朝仁老師與李一星老師帶來的精彩對談，以「觀者」為核心，透過直面敘事懸置的狀態，在閱讀與觀看之間映照內在自我，開啟一場與自身對話的探索之旅。'},
    {id:2,  title:'與書的盲目約會', tag:'趣味互動活動', s:'2026-12-01', e:'2026-12-10', place:'圖書館2F 新書展示區前', type:'show', range:'12/1–12/10'},
    {id:3,  title:'校園書活節', tag:'圖書X美食X手作市集', s:'2026-12-01', e:'2026-12-03', time:'10:00-16:00', place:'圖書館門口廣場', type:'market', range:'12/1–12/3'},
    {id:4,  title:'星際情報站', tag:'圖書館資源市集', s:'2026-12-01', e:'2026-12-01', time:'10:00-16:00', place:'圖書館2F 大廳', type:'market'},
    {id:5,  title:'Openbook好書獎', tag:'主題書展', s:'2026-12-01', e:'2027-01-31', place:'圖書館2F 新書展示區', type:'show', range:'12/1–116/1/31'},
    {id:6,  title:'出走放映室', tag:'主題影展', s:'2026-12-01', e:'2027-01-31', place:'圖書館2F 多媒體資料區', type:'show', range:'12/1–116/1/31'},
    {id:7,  title:'探索者任務代號 MISSION 01：EndNote', s:'2026-12-02', e:'2026-12-02', time:'14:00-16:00', place:'圖書館8F 814教室', type:'talk'},
    {id:8,  title:'靈魂邂逅所：深刻地認識一個人 連結卡牌體驗', s:'2026-12-03', e:'2026-12-03', time:'14:00-16:00', place:'圖書館3F 暖心窩', type:'fun'},
    {id:9,  title:'翻開繪本，種一棵屬於自己的樹：療癒書寫工作坊', s:'2026-12-04', e:'2026-12-04', time:'10:00-12:00', place:'圖書館B1 藝術工坊', type:'fun'},
    {id:10, title:'靈魂邂逅所：深刻地認識一個人 連結卡牌體驗', s:'2026-12-07', e:'2026-12-07', time:'14:00-16:00', place:'圖書館3F 暖心窩', type:'fun'},
    {id:11, title:'從阿里山到山丘｜歌聲裡的時光記憶音樂會', s:'2026-12-08', e:'2026-12-08', time:'19:00-21:00', place:'活動中心演藝廳', type:'fun'},
    {id:12, title:'探索者任務代號 MISSION 02：Turnitin', s:'2026-12-08', e:'2026-12-08', time:'14:00-16:00', place:'圖書館8F 814教室', type:'talk'},
    {id:13, title:'偶遇計畫，閱讀的另一種可能：二手書刊拍賣', s:'2026-12-08', e:'2026-12-09', time:'10:00-16:30', place:'圖書館2F 大廳', type:'market', range:'12/8–12/9'},
    {id:14, title:'活動集點截止', s:'2026-12-10', e:'2026-12-10', deadline:true, type:'point', range:'12/10 截止'}
  ];

  const pad = n => String(n).padStart(2,'0');
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const roc = d => `${d.y - 1911}/${d.m}/${d.d}`;
  const at = (iso, hhmm) => new Date(`${iso}T${hhmm}:00+08:00`);

  // 日期列：11/30 – 12/15
  const DAYS = [];
  const D0 = Date.UTC(2026, 10, 30);
  const HIDDEN = ['2026-12-05', '2026-12-06']; // 週六、週日不顯示
  for (let i = 0; i < 11; i++) { // 11/30 – 12/10
    const dt = new Date(D0 + i * 864e5);
    if (HIDDEN.includes(dt.toISOString().slice(0,10))) continue;
    DAYS.push({iso: dt.toISOString().slice(0,10), y: dt.getUTCFullYear(), m: dt.getUTCMonth()+1, d: dt.getUTCDate(), wd: dt.getUTCDay()});
  }
  const KEYS = [...DAYS.map(d => d.iso), 'all'];
  const dayOf = iso => DAYS.find(d => d.iso === iso);
  const inRange = (ev, iso) => ev.s <= iso && iso <= ev.e;
  const timedOn = iso => EVENTS.filter(ev => (ev.time || ev.deadline) && inRange(ev, iso)).sort((a,b) => (a.time || '99').localeCompare(b.time || '99') || a.id - b.id);
  const ongoingOn = iso => EVENTS.filter(ev => !ev.time && !ev.deadline && inRange(ev, iso));


  const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
  const behavior = () => mq.matches ? 'auto' : 'smooth';
  const $ = id => document.getElementById(id);
  const strip = $('dayStrip'), panel = $('panel');
  let current = null;

  /* ---------- 卡片 ---------- */
  function card(ev, iso) {
    const t = TYPES[ev.type];
    let live = false;
    if (ev.time && iso) {
      const [a, b] = ev.time.split('-');
      const n = Date.now();
      live = n >= at(iso,a) && n < at(iso,b);
    }
    return `<article class="ev" style="--c:${t.color}">
      <div class="ev-top">
        <span class="badge"><svg viewBox="0 0 24 24" aria-hidden="true">${t.icon}</svg>${esc(ev.tag || t.label)}</span>
        ${ev.range ? `<span class="tag">${ev.range}</span>` : ''}
        ${live ? '<span class="tag live">進行中</span>' : ''}
      </div>
      <h4 class="ev-title">${esc(ev.title)}</h4>
      ${ev.place ? `<p class="ev-place">${PIN}<span>${esc(ev.place)}</span></p>` : ''}
      ${ev.link !== undefined ? `<p class="ev-link">${LINK}${ev.link ? `<a href="${esc(ev.link)}" target="_blank" rel="noopener">活動報名連結</a>` : '<span>活動報名連結（待補上）</span>'}</p>` : ''}
      ${ev.desc ? `<p class="ev-desc">${esc(ev.desc)}</p>` : ''}
    </article>`;
  }

  const FLAG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 21V4"/><path d="M6 4h12l-3 4 3 4H6z"/></svg>';
  const EMPTY = `<div class="empty bounce" style="--i:1">
    <svg viewBox="0 0 140 100" aria-hidden="true">
      <rect x="24" y="24" width="88" height="62" rx="14" fill="#F6D27A" stroke="#3E3A39" stroke-width="3"/>
      <path d="M44 24v62" stroke="#3E3A39" stroke-width="3"/>
      <path d="M58 52q6 6 12 0M82 52q6 6 12 0M71 64q4 4 8 0" fill="none" stroke="#3E3A39" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="58" cy="62" r="4" fill="#F2A497"/><circle cx="96" cy="62" r="4" fill="#F2A497"/>
      <text class="zz" x="108" y="22" font-size="16" fill="#3E3A39" style="font-family:inherit">z z</text>
    </svg>
    <p>這天沒有定時活動，來逛逛展期中的展覽吧！</p>
  </div>`;

  /* ---------- 面板 ---------- */
  function renderDay(iso) {
    const d = dayOf(iso);
    const timed = timedOn(iso), ongoing = ongoingOn(iso);
    const groups = [];
    timed.forEach(ev => {
      let g = groups.find(x => x.time === ev.time);
      if (!g) { g = {time: ev.time, list: []}; groups.push(g); }
      g.list.push(ev);
    });

    let i = 0;
    let html = `<div class="day-head bounce" style="--i:${i++}">
      <h3>${d.m}月${d.d}日<span class="wd">週${WD[d.wd]}</span></h3>
      <p>${roc(d)}・${timed.length ? `${timed.length} 項日程` : '沒有定時活動'}${ongoing.length ? `・${ongoing.length} 項展期中` : ''}</p>
    </div>`;

    if (groups.length) {
      html += '<ol class="timeline">' + groups.map(g => {
        const [a, b] = g.time ? g.time.split('-') : ['當日', '截止'];
        const c = TYPES[g.list[0].type].color;
        return `<li class="tl-group bounce" style="--i:${i++}">
          <div class="tl-time"><b>${a}</b><span>${b}</span></div>
          <div class="tl-dot" style="--c:${c}"></div>
          <div class="tl-cards">${g.list.map(ev => card(ev, iso)).join('')}</div>
        </li>`;
      }).join('') + '</ol>';
    } else {
      html += EMPTY;
    }

    if (ongoing.length) {
      html += `<div class="bounce" style="--i:${i++}">
        <h3 class="sub-title">${FLAG}期間限定展期中</h3>
        <p class="sub-note">圖書館週活動期間皆可參與觀展</p>
        <div class="ongoing-list">${ongoing.map(ev => card(ev)).join('')}</div>
      </div>`;
    }
    return html;
  }

  function renderAll() {
    const list = EVENTS.filter(ev => !ev.time && !ev.deadline).sort((a,b) => a.e.localeCompare(b.e) || a.id - b.id);
    return `<div class="day-head bounce" style="--i:0">
        <h3>期間展限定</h3>
        <p>圖書館週活動期間皆可參與觀展</p>
      </div>
      <div class="ongoing-list">${list.map((ev, k) => `<div class="bounce" style="--i:${k+1}">${card(ev)}</div>`).join('')}</div>`;
  }

  /* ---------- 日期列 ---------- */
  strip.innerHTML = DAYS.map(d => {
    const has = timedOn(d.iso).length > 0;
    const we = d.wd === 0 || d.wd === 6;
    return `<button class="chip${we ? ' we' : ''}" role="tab" id="tab-${d.iso}" data-key="${d.iso}" aria-selected="false" aria-controls="panel" tabindex="-1"
      aria-label="${d.m}月${d.d}日 週${WD[d.wd]}${has ? '，有定時活動' : ''}">
      <small>${d.m}月</small><span class="n">${d.d}</span><span class="w">週${WD[d.wd]}</span><i class="dot${has ? ' on' : ''}"></i>
    </button>`;
  }).join('') + `<button class="chip all" role="tab" id="tab-all" data-key="all" aria-selected="false" aria-controls="panel" tabindex="-1" aria-label="期間展限定">
      <small>期間</small><span class="n">展</span><span class="w">限定</span><i class="dot"></i>
    </button>`;

  function select(key, opts = {}) {
    if (!KEYS.includes(key)) return;
    const prev = strip.querySelector('.is-active');
    if (prev && prev.dataset.key !== key) {
      prev.classList.remove('is-active');
      prev.setAttribute('aria-selected', 'false');
      prev.tabIndex = -1;
    }
    const chip = $('tab-' + key);
    if (current === key && chip.classList.contains('is-active') && !opts.force) return;
    chip.classList.add('is-active');
    chip.setAttribute('aria-selected', 'true');
    chip.tabIndex = 0;
    if (opts.focus) chip.focus({preventScroll: true});
    strip.scrollTo({left: chip.offsetLeft - (strip.clientWidth - chip.offsetWidth) / 2, behavior: opts.instant ? 'auto' : behavior()});

    current = key;
    panel.setAttribute('aria-labelledby', 'tab-' + key);
    panel.innerHTML = key === 'all' ? renderAll() : renderDay(key);

    if (!opts.instant) {
      const wrap = strip.parentElement;
      const top = panel.getBoundingClientRect().top + window.scrollY - wrap.getBoundingClientRect().height - 58 - 6;
      if (window.scrollY > top) window.scrollTo({top, behavior: behavior()});
    }
  }

  strip.addEventListener('click', e => {
    const c = e.target.closest('.chip');
    if (c) select(c.dataset.key);
  });
  strip.addEventListener('keydown', e => {
    const i = KEYS.indexOf(current);
    let n = null;
    if (e.key === 'ArrowRight') n = Math.min(KEYS.length - 1, i + 1);
    else if (e.key === 'ArrowLeft') n = Math.max(0, i - 1);
    else if (e.key === 'Home') n = 0;
    else if (e.key === 'End') n = KEYS.length - 1;
    if (n !== null) { e.preventDefault(); select(KEYS[n], {focus: true}); }
  });

  // 左右滑動換日
  let t0 = null;
  panel.addEventListener('touchstart', e => { t0 = {x: e.touches[0].clientX, y: e.touches[0].clientY}; }, {passive: true});
  panel.addEventListener('touchend', e => {
    if (!t0) return;
    const dx = e.changedTouches[0].clientX - t0.x, dy = e.changedTouches[0].clientY - t0.y;
    t0 = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.6) {
      const n = KEYS.indexOf(current) + (dx < 0 ? 1 : -1);
      if (n >= 0 && n < KEYS.length) select(KEYS[n]);
    }
  }, {passive: true});

  /* ---------- 選單高亮 ---------- */
  const links = [...document.querySelectorAll('.nav nav a')];
  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver(entries => {
      entries.forEach(en => {
        if (!en.isIntersecting) return;
        links.forEach(a => {
          const on = a.dataset.sec === en.target.id;
          a.classList.toggle('on', on);
          if (on) a.setAttribute('aria-current', 'true'); else a.removeAttribute('aria-current');
        });
      });
    }, {rootMargin: '-35% 0px -60% 0px'});
    ['home', 'schedule', 'prizes'].forEach(id => io.observe($(id)));
  }

  /* ---------- 初始日期 ---------- */
  const todayIso = new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10);
  const nextDay = DAYS.find(d => d.iso >= todayIso);
  const first = nextDay ? nextDay.iso : (todayIso <= '2027-01-31' ? 'all' : DAYS[0].iso);
  select(first, {instant: true, force: true});

  /* ---------- 獎品卡片進場 ---------- */
  if ('IntersectionObserver' in window) {
    const po = new IntersectionObserver(es => es.forEach(en => {
      if (en.isIntersecting) { en.target.classList.add('bounce'); po.unobserve(en.target); }
    }), {threshold: .3});
    document.querySelectorAll('.prize').forEach(el => po.observe(el));
  }

  /* ---------- 星空背景 ---------- */
  const host = $('sky');
  let skyW = 0;
  function drawSky() {
    const W = Math.max(window.innerWidth, 320), H = Math.max(window.innerHeight, 900);
    skyW = W;
    let seed = 20261130;
    const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
    const cols = ['#FFFCF6', '#FFFCF6', '#FFFCF6', '#F6D27A', '#A8D3E6'];
    let s = '';
    const dots = Math.round(W * H / 4200);
    for (let i = 0; i < dots; i++) {
      const x = (rnd() * W).toFixed(1), y = (rnd() * H).toFixed(1), r = (0.8 + rnd() * 1.5).toFixed(2);
      const c = cols[Math.floor(rnd() * cols.length)];
      const tw = rnd() < .55 ? ` class="st" style="animation-delay:-${(rnd() * 4).toFixed(2)}s;animation-duration:${(2.6 + rnd() * 3).toFixed(1)}s"` : '';
      s += `<circle cx="${x}" cy="${y}" r="${r}" fill="${c}"${tw}/>`;
    }
    const sparks = Math.round(W * H / 22000) + 8;
    for (let i = 0; i < sparks; i++) {
      const x = (rnd() * W).toFixed(1), y = (rnd() * H).toFixed(1), k = (0.6 + rnd() * 0.7).toFixed(2);
      const c = rnd() < .6 ? '#F6D27A' : '#FFFCF6';
      s += `<g transform="translate(${x} ${y}) scale(${k})"><path class="st" style="animation-delay:-${(rnd() * 4).toFixed(2)}s" d="M0 -7 L1.8 -1.8 L7 0 L1.8 1.8 L0 7 L-1.8 1.8 L-7 0 L-1.8 -1.8 Z" fill="${c}"/></g>`;
    }
    host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMin slice" xmlns="http://www.w3.org/2000/svg">${s}</svg>`;
  }
  drawSky();
  let rz;
  window.addEventListener('resize', () => {
    clearTimeout(rz);
    rz = setTimeout(() => { if (window.innerWidth !== skyW) drawSky(); }, 200);
  });
})();
</script>
</body>
</html>
